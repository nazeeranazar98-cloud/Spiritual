const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const ramp=(t,a,b)=>clamp((t-a)/(b-a));
const PI=Math.PI;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hex(c){const p=parseInt(c.slice(1),16);return[p>>16,p>>8&255,p&255]}
function mixc(a,b,t){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`}
function shade(c,k){const A=hex(c);return `rgb(${A.map(v=>Math.round(clamp(v*k,0,255))).join(',')})`}

 draupadi:{f:1,w:.86,skin:'#c98d62',cloth:'#b3122a',cloth2:'#7d0b1d',border:'#f0c04a',blouse:'#8e0e22',hair:'#120907',hairStyle:'open',seed:1,lips:'#9e2a36'},

 dhrit:{w:1.05,skin:'#c8956b',top:'#5d4037',dhoti:'#4e342e',crown:'king',hairStyle:'short',hair:'#8d8d8d',beard:'#9e9e9e',beardLen:.8,blind:1,seed:14},
 vidura:{w:.95,skin:'#c8956b',top:'#efebe9',dhoti:'#d7ccc8',hair:'#8d8d8d',hairStyle:'knot',beard:'#9e9e9e',beardLen:.7,seed:15},

const PZ={
 down:{lh:[-100,-272],rh:[100,-272]},

function P(name,ex={}){return Object.assign({},PZ[name],ex)}
// keyframe interpolation
function kf(t,keys){
 if(t<=keys[0][0])return keys[0][1];
 for(let i=0;i<keys.length-1;i++){const [a,A]=keys[i],[b,B]=keys[i+1];
  if(t<b){const k=ease((t-a)/(b-a));return interp(A,B,k)}}
 return keys[keys.length-1][1];
}
function interp(A,B,k){const o={};const ks=new Set([...Object.keys(A),...Object.keys(B)]);
 for(const key of ks){const a=A[key]??(Array.isArray(B[key])?B[key]:0),b=B[key]??(Array.isArray(A[key])?A[key]:0);
  if(Array.isArray(a))o[key]=[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];
  else if(typeof a==='number')o[key]=lerp(a,b,k);else o[key]=k<.5?a:b;}
 return o}

// ---- mouth drivers ----
function singAmt(t){
 for(const [s,d] of window.NOTES){ if(t>=s&&t<s+d){const p=(t-s)/d;
   const env=Math.pow(Math.sin(PI*Math.min(1,p*1.15+.05)),.6);
   const syl=d>0.7?(.65+.35*Math.abs(Math.sin((t-s)*7.5))):1;
   return clamp(env*syl*(.55+.4*((s*13.7)%1)));}}
 return 0;
}
function talkAmt(t,t0,t1){if(t<t0||t>t1)return 0;const x=t-t0;
 return clamp((.2+.8*Math.abs(Math.sin(x*12.5)))*(.55+.45*Math.sin(x*4.7+1))*Math.min(1,(t1-t)*6,x*8));}
function blink(t,seed){const per=3.1+(seed%3)*.7;const ph=(t+seed*1.37)%per;return ph<.16?Math.sin(ph/.16*PI):0}

// ---- 2-bone IK ----
function ik(S,T,a,b,sgn){
 let dx=T[0]-S[0],dy=T[1]-S[1];let d=Math.hypot(dx,dy);
 const dd=clamp(d,Math.abs(a-b)+1,a+b-.5);const ang=Math.atan2(dy,dx);
 const A=Math.acos(clamp((a*a+dd*dd-b*b)/(2*a*dd),-1,1));
 const c1=[S[0]+a*Math.cos(ang+A),S[1]+a*Math.sin(ang+A)],c2=[S[0]+a*Math.cos(ang-A),S[1]+a*Math.sin(ang-A)];
 const sc=c=>sgn*c[0]+.35*c[1];
 const E=sc(c1)>sc(c2)?c1:c2;
 const ea=Math.atan2(T[1]-E[1],T[0]-E[0]);
 const Wp=[E[0]+b*Math.cos(ea),E[1]+b*Math.sin(ea)];
 return[E,Wp];
}
function seg(A,B,w,col,cap='round'){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap=cap;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
const pt=(A,B,k)=>[lerp(A[0],B[0],k),lerp(A[1],B[1],k)];
const OL='rgba(40,18,8,.85)';

function grad(x0,y0,x1,y1,stops){const g=ctx.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}

function drawArm(c,S,T,sgn,t,isF,sleeve){
 const a=isF?148:158,b=isF?138:146;
 const [E,Wr]=ik(S,T,a,b,sgn);
 const wU=isF?27:33*Math.min(c.w,1.2),wF=isF?22:27*Math.min(c.w,1.15);
 seg(S,E,wU+4,OL);seg(E,Wr,wF+4,OL);
 seg(S,E,wU,c.skin);seg(E,Wr,wF,c.skin);
 // highlight
 ctx.globalAlpha*=.25;seg(pt(S,E,.1),pt(S,E,.9),wU*.35,'#fff');seg(pt(E,Wr,.1),pt(E,Wr,.85),wF*.3,'#fff');ctx.globalAlpha/=.25;
 if(sleeve){seg(S,pt(S,E,.42),wU+5,sleeve,'butt');seg(pt(S,E,.38),pt(S,E,.45),wU+6,c.border||'#e0b13a','butt');}
 else if(!c.top){seg(pt(S,E,.36),pt(S,E,.46),wU+5,'#e0b13a','butt');ctx.fillStyle='#c62828';const m=pt(S,E,.41);ctx.beginPath();ctx.arc(m[0],m[1],4,0,7);ctx.fill();}
 else{seg(S,pt(S,E,.75),wU+6,c.top,'butt');}
 // bangles / bracelets
 seg(pt(E,Wr,.8),pt(E,Wr,.93),wF+4,'#e8b923','butt');
 if(isF){ctx.strokeStyle='#c62828';ctx.lineWidth=2;const m=pt(E,Wr,.86);}
 // hand
 const ang=Math.atan2(Wr[1]-E[1],Wr[0]-E[0]);
 ctx.save();ctx.translate(Wr[0],Wr[1]);ctx.rotate(ang-PI/2);
 ctx.fillStyle=c.skin;ctx.strokeStyle=OL;ctx.lineWidth=2.5;
 ctx.beginPath();ctx.ellipse(0,16,isF?12:14,isF?19:20,0,0,7);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.ellipse(-sgn*11,8,5,10,sgn*.6,0,7);ctx.fill();ctx.stroke();
 if(isF){ctx.fillStyle='#d32f2f';ctx.beginPath();ctx.arc(0,18,3.2,0,7);ctx.fill();} // mehendi dot
 ctx.restore();
 return Wr;
}

// ---- head ----
function facePath(){ctx.beginPath();ctx.moveTo(0,-64);ctx.bezierCurveTo(36,-64,51,-38,51,-8);ctx.bezierCurveTo(51,22,39,44,19,57);ctx.quadraticCurveTo(0,68,-19,57);ctx.bezierCurveTo(-39,44,-51,22,-51,-8);ctx.bezierCurveTo(-51,-38,-36,-64,0,-64);ctx.closePath();}
function drawHairBack(c,t,id){
 const hc=c.hair||'#140c08';
 if(c.hairStyle==='open'||c.hairStyle==='long'){
  const L=c.hairStyle==='open'?470:240;const wv=Math.sin(t*1.7+c.seed)*14,wv2=Math.sin(t*2.3+1)*10;
  ctx.fillStyle=hc;ctx.strokeStyle=OL;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-54,-20);
  ctx.bezierCurveTo(-82,60,-92+wv,L*.5,-80+wv2,L);
  ctx.quadraticCurveTo(-20+wv,L+30,40+wv2,L+5);
  ctx.quadraticCurveTo(92+wv,L*.6,58,-20);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=3;
  for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*12,10);ctx.quadraticCurveTo(i*18+wv,L*.5,i*14+wv2,L*.95);ctx.stroke();}
 }
 if(c.hairStyle==='curls'){
  ctx.fillStyle=hc;for(let i=0;i<7;i++){const yy=-10+i*16,sw=Math.sin(t*2+i)*2;for(const s of[-1,1]){ctx.beginPath();ctx.arc(s*(50+i*2.5)+sw,yy,13,0,7);ctx.fill();}}
 }
}
function drawHead(c,id,Pp,t,mouth){
 const turn=Pp.turn||0;const fx=turn*7;
 // ears
 ctx.fillStyle=c.skin;ctx.strokeStyle=OL;ctx.lineWidth=2.5;
 for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*50-turn*3,4,9,16,0,0,7);ctx.fill();ctx.stroke();}
 // face
 facePath();
 const g=ctx.createRadialGradient(-14+fx,-18,8,0,0,80);g.addColorStop(0,shade(c.skin,1.12));g.addColorStop(.7,c.skin);g.addColorStop(1,shade(c.skin,.8));
 ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=3;ctx.stroke();
 // cheeks
 for(const s of[-1,1]){const cg=ctx.createRadialGradient(s*28+fx,20,1,s*28+fx,20,16);cg.addColorStop(0,c.f?'rgba(230,90,90,.35)':'rgba(200,90,80,.18)');cg.addColorStop(1,'rgba(230,90,90,0)');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(s*28+fx,20,16,0,7);ctx.fill();}
 // eyes
 const close=Math.max(Pp.eyeClose||0,blink(t,c.seed)*(1-(Pp.eyeClose||0)));
 const open=c.blind?Math.min(.35,1-close):1-close;
 const wide=1+(Pp.wide||0)*.35;const sad=Pp.brow||0;
 const look=Pp.look||[0,0];
 const es=c.f?1.12:1;
 for(const s of[-1,1]){
  const cx=s*19+fx,cy=-3;
  const ew=14*es,eh=9*es*wide*open;
  if(open>.12){
   ctx.save();ctx.beginPath();ctx.moveTo(cx-ew,cy);ctx.quadraticCurveTo(cx,cy-eh*1.5,cx+ew,cy-1);ctx.quadraticCurveTo(cx,cy+eh*1.05,cx-ew,cy);ctx.closePath();
   ctx.fillStyle=c.blind?'#e6e0d8':'#fbf6f0';ctx.fill();ctx.clip();
   if(!c.blind){const ix=cx+look[0]*5,iy=cy+look[1]*3;
    const ig=ctx.createRadialGradient(ix-1,iy-1,1,ix,iy,7.5*es);ig.addColorStop(0,'#7a4a24');ig.addColorStop(1,'#2a160a');
    ctx.fillStyle=ig;ctx.beginPath();ctx.arc(ix,iy,7.5*es,0,7);ctx.fill();
    ctx.fillStyle='#0a0503';ctx.beginPath();ctx.arc(ix,iy,3.4*es,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ix+2.5,iy-3,2.1,0,7);ctx.fill();ctx.beginPath();ctx.arc(ix-2.5,iy+2.5,1,0,7);ctx.fill();}
   ctx.restore();
   // upper lid / kajal
   ctx.strokeStyle='#120806';ctx.lineWidth=c.f?3.2:2.6;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(cx-ew,cy);ctx.quadraticCurveTo(cx,cy-eh*1.5,cx+ew,cy-1);
   if(c.f){ctx.lineTo(cx+s*0+ew+s*0,cy-1);} ctx.stroke();
   if(c.f){ctx.beginPath();const ox=s>0?cx+ew:cx-ew;ctx.moveTo(ox,cy-1);ctx.lineTo(ox+s*6,cy-5);ctx.stroke();
     ctx.lineWidth=1.5;for(let k=0;k<4;k++){const px=cx+s*(k*4+2),py=cy-eh*1.2+k*.8;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+s*2.5,py-4);ctx.stroke();}}
   ctx.lineWidth=1.2;ctx.strokeStyle='rgba(60,20,10,.6)';ctx.beginPath();ctx.moveTo(cx-ew+2,cy+1);ctx.quadraticCurveTo(cx,cy+eh*1.05,cx+ew-2,cy);ctx.stroke();
  } else {
   ctx.strokeStyle='#120806';ctx.lineWidth=c.f?3:2.4;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(cx-ew,cy);ctx.quadraticCurveTo(cx,cy+6,cx+ew,cy);ctx.stroke();
   if(c.f){ctx.lineWidth=1.4;for(let k=0;k<4;k++){const px=cx-ew*.6+k*ew*.4;ctx.beginPath();ctx.moveTo(px,cy+3);ctx.lineTo(px+s,cy+7);ctx.stroke();}}
  }
  // brows
  ctx.strokeStyle=c.hair&&c.hair!=='#140c08'&&!c.f?shade(c.hair,.85):'#1a0d08';ctx.lineWidth=c.f?3:4.2*(c.brutal?1.4:1);
  const inner=cx-s*ew*.95,outer=cx+s*ew*1.05;const by=cy-15*es-(Pp.wide||0)*4;
  const innerY=by+sad*-7+(Pp.angry||0)*6;
  ctx.beginPath();ctx.moveTo(inner,innerY);ctx.quadraticCurveTo(cx,by-6,outer,by+2);ctx.stroke();
  // tears
  if(Pp.tears){for(let i=0;i<2;i++){const tt=((t*.55+i*.5+s*.13)%1);ctx.fillStyle='rgba(200,235,255,.95)';ctx.beginPath();ctx.ellipse(cx-s*2,cy+8+tt*42,2.6,4,0,0,7);ctx.fill();}
   ctx.strokeStyle='rgba(220,240,255,.25)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx-s*2,cy+8);ctx.lineTo(cx-s*3,cy+40);ctx.stroke();}
 }
 // nose
 ctx.strokeStyle='rgba(70,30,15,.75)';ctx.lineWidth=2.4;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(fx+turn*3-2,4);ctx.quadraticCurveTo(fx+turn*6+5,20,fx-1,25);ctx.stroke();
 ctx.beginPath();ctx.moveTo(fx-7,24);ctx.quadraticCurveTo(fx-3,28,fx+2,25);ctx.stroke();
 if(c.f){ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(fx-7,23,2.6,0,7);ctx.fill();}
 // mustache
 if(c.mustache){ctx.fillStyle=c.hair||'#140c08';ctx.beginPath();const mw=c.mustache===2?20:15;ctx.moveTo(fx,32);ctx.quadraticCurveTo(fx-mw*.5,27,fx-mw,36);ctx.quadraticCurveTo(fx-mw*.4,33,fx,35);ctx.quadraticCurveTo(fx+mw*.4,33,fx+mw,36);ctx.quadraticCurveTo(fx+mw*.5,27,fx,32);ctx.fill();}
 // mouth
 const m=clamp(mouth);const sm=Pp.smile||0;const my=40;const mw2=13+sm*3+m*1.5;
 const lip=c.lips||shade(c.skin,.68);
 if(m>.06){
  ctx.fillStyle='#3a0b10';ctx.beginPath();ctx.moveTo(fx-mw2,my-sm*3);ctx.quadraticCurveTo(fx,my-4-sm*1,fx+mw2,my-sm*3);ctx.quadraticCurveTo(fx,my+4+m*17,fx-mw2,my-sm*3);ctx.fill();
  ctx.save();ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(fx-mw2,my-6,mw2*2,5.5);ctx.fillStyle='#c2185b';ctx.beginPath();ctx.ellipse(fx,my+4+m*14,8,5,0,0,7);ctx.fill();ctx.restore();
  ctx.strokeStyle=lip;ctx.lineWidth=c.f?4:2.6;ctx.beginPath();ctx.moveTo(fx-mw2,my-sm*3);ctx.quadraticCurveTo(fx,my-5,fx+mw2,my-sm*3);ctx.stroke();
  ctx.lineWidth=c.f?4.5:2.6;ctx.beginPath();ctx.moveTo(fx-mw2,my-sm*3);ctx.quadraticCurveTo(fx,my+5+m*18,fx+mw2,my-sm*3);ctx.stroke();
 } else {
  ctx.fillStyle=lip;ctx.beginPath();ctx.moveTo(fx-mw2,my-sm*4);ctx.quadraticCurveTo(fx-5,my-6,fx,my-3);ctx.quadraticCurveTo(fx+5,my-6,fx+mw2,my-sm*4);ctx.quadraticCurveTo(fx,my+(c.f?9:5)+sm*2,fx-mw2,my-sm*4);ctx.fill();
  ctx.strokeStyle='rgba(60,10,10,.8)';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(fx-mw2,my-sm*4);ctx.quadraticCurveTo(fx,my+1+sm*3,fx+mw2,my-sm*4);ctx.stroke();
 }
 // beard
 if(c.beard){const L=c.beardLen||1;ctx.fillStyle=c.beard;ctx.strokeStyle=OL;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-46,10);ctx.quadraticCurveTo(-44,50,-22,58);ctx.quadraticCurveTo(-12,62+ (m*10),fx-6,57+m*10);ctx.lineTo(fx+6,57+m*10);ctx.quadraticCurveTo(12,62,22,58);ctx.quadraticCurveTo(44,50,46,10);
  ctx.quadraticCurveTo(50,70+L*40,0,80+L*70);ctx.quadraticCurveTo(-50,70+L*40,-46,10);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.12)';for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*9,60);ctx.lineTo(i*7,72+L*60);ctx.stroke();}
  ctx.fillStyle=c.beard;ctx.beginPath();ctx.moveTo(fx,31);ctx.quadraticCurveTo(fx-12,26,fx-22,40);ctx.quadraticCurveTo(fx-10,33,fx,35);ctx.quadraticCurveTo(fx+10,33,fx+22,40);ctx.quadraticCurveTo(fx+12,26,fx,31);ctx.fill();
 }
 // hair front
 const hc=c.hair||'#140c08';ctx.fillStyle=hc;ctx.strokeStyle=OL;ctx.lineWidth=2.5;
